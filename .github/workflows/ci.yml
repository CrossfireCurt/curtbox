name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      # This source archive did not originally include a lockfile. Once you
      # commit package-lock.json, npm ci becomes the reproducible default.
      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Typecheck
        run: npm run check
      - name: Server tests
        run: npm test
      - name: Dependency-light gameplay and UI tests
        run: npm run test:pure
      - name: Audio archive regression tests
        run: npm run test:audio
      - name: Production build
        run: npm run build
      - name: Package compiled app
        shell: bash
        run: bash scripts/package-release.sh "commit-${GITHUB_SHA:0:12}" release
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: curtbox-compiled-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish-main:
    name: Publish development Docker image (:main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Normalize image repository name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=main
          labels: |
            org.opencontainers.image.title=Curtbox
            org.opencontainers.image.description=Self-hosted multiplayer party games
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
