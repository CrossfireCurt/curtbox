name: Delete merged PR branches

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:

# Branch deletion needs write access to Git refs but no other privileges.
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-merged-pr-branches
  cancel-in-progress: false

jobs:
  delete-merged:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove unchanged head branches belonging to merged PRs
        uses: actions/github-script@v7
        with:
          script: |
            const {cleanupMergedBranches}=require('./scripts/cleanup-merged-branches.cjs');
            await cleanupMergedBranches({github,core,...context.repo});
