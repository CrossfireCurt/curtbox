name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and create release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate release tag
        shell: bash
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - run: npm run check
      - run: npm test
      - run: npm run test:pure
      - run: npm run test:audio
      - run: npm run build
      - name: Create compiled release bundle and SHA256 checksums
        run: bash scripts/package-release.sh "$GITHUB_REF_NAME" release
      - name: Upload release bundle between jobs
        uses: actions/upload-artifact@v7
        with:
          name: curtbox-release-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  image:
    name: Push versioned GHCR image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Normalize image repository name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Curtbox
            org.opencontainers.image.description=Self-hosted multiplayer party games
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tv-apk:
    name: Build Android TV sideload APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build TV APK
        working-directory: android-tv
        run: gradle :app:assembleDebug --no-daemon
      - name: Name APK for release and generate checksum
        shell: bash
        run: |
          mkdir -p tv-release
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk "tv-release/curtbox-tv-${GITHUB_REF_NAME}-debug.apk"
          (cd tv-release && sha256sum *.apk > SHA256SUMS-tv.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: curtbox-tv-${{ github.ref_name }}
          path: tv-release/
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish GitHub Release assets
    needs: [build, image, tv-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: curtbox-release-${{ github.ref_name }}
          path: release
      - name: Download Android TV APK
        uses: actions/download-artifact@v7
        with:
          name: curtbox-tv-${{ github.ref_name }}
          path: release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.tar.gz release/*.apk release/SHA256SUMS.txt release/SHA256SUMS-tv.txt)
          if (( ${#files[@]} < 4 )); then
            echo 'Missing release assets' >&2
            exit 1
          fi
          prerelease_flag=()
          if [[ "$TAG" == *-* ]]; then prerelease_flag=(--prerelease); fi
          gh release create "$TAG" "${files[@]}" \
            --verify-tag --title "Curtbox $TAG" --generate-notes \
            "${prerelease_flag[@]}"
